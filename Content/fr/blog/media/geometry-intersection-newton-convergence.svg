<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 700 380" width="700" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="700" height="380" fill="#ffffff"/>

  <!-- Courbe 0 (bleue) -->
  <path d="M 40,300 C 120,270 200,190 300,140 C 400,90 520,80 660,90"
        fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Courbe 1 (verte) -->
  <path d="M 50,60 C 130,100 220,180 320,230 C 420,280 540,300 660,290"
        fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Point d'intersection exact -->
  <circle cx="305" cy="185" r="8" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- ===== ITÉRATION 0 (candidat initial, le plus éloigné) ===== -->

  <!-- Point sur C₀ -->
  <circle cx="180" cy="210" r="5" fill="#3b82f6" opacity="0.4"/>
  <!-- Point sur C₁ -->
  <circle cx="210" cy="170" r="5" fill="#10b981" opacity="0.4"/>
  <!-- Résidu -->
  <line x1="210" y1="170" x2="183" y2="207" stroke="#ef4444" stroke-width="1.5" opacity="0.4"/>

  <!-- Label -->
  <text x="148" y="220" font-family="sans-serif" font-size="11" fill="#94a3b8">n = 0</text>

  <!-- ===== ITÉRATION 1 ===== -->

  <!-- Point sur C₀ -->
  <circle cx="265" cy="158" r="5" fill="#3b82f6" opacity="0.6"/>
  <!-- Point sur C₁ -->
  <circle cx="278" cy="200" r="5" fill="#10b981" opacity="0.6"/>
  <!-- Résidu -->
  <line x1="278" y1="200" x2="267" y2="161" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>

  <!-- Label -->
  <text x="233" y="155" font-family="sans-serif" font-size="11" fill="#94a3b8">n = 1</text>

  <!-- ===== ITÉRATION 2 ===== -->

  <!-- Point sur C₀ -->
  <circle cx="297" cy="146" r="5" fill="#3b82f6" opacity="0.8"/>
  <!-- Point sur C₁ -->
  <circle cx="300" cy="190" r="5" fill="#10b981" opacity="0.8"/>
  <!-- Résidu -->
  <line x1="300" y1="190" x2="298" y2="149" stroke="#ef4444" stroke-width="1.5" opacity="0.8"/>

  <!-- Label -->
  <text x="310" y="145" font-family="sans-serif" font-size="11" fill="#94a3b8">n = 2</text>

  <!-- ===== ITÉRATION 3 (convergé) ===== -->

  <!-- Points confondus -->
  <circle cx="305" cy="185" r="6" fill="#ef4444"/>
  <circle cx="305" cy="185" r="3" fill="#ffffff"/>

  <!-- Label -->
  <text x="318" y="182" font-family="sans-serif" font-size="12" fill="#ef4444" font-weight="bold">n = 3 ✓</text>

  <!-- Flèches de progression entre itérations (courbe 0) -->
  <path d="M 184,208 C 210,195 240,170 262,161" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <path d="M 268,157 C 278,152 288,148 294,147" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Flèches de progression entre itérations (courbe 1) -->
  <path d="M 213,172 C 235,180 255,190 275,198" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>
  <path d="M 281,201 C 288,194 293,192 298,191" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="3 2" opacity="0.5"/>

  <!-- Tableau de convergence -->
  <rect x="430" y="30" width="250" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="555" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155" font-weight="bold">Convergence quadratique</text>

  <line x1="445" y1="62" x2="665" y2="62" stroke="#e2e8f0" stroke-width="1"/>

  <text x="475" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">n</text>
  <text x="575" y="80" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="bold">‖F‖</text>

  <line x1="445" y1="88" x2="665" y2="88" stroke="#e2e8f0" stroke-width="1"/>

  <text x="475" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">0</text>
  <text x="575" y="106" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">4.2 × 10⁻²</text>

  <text x="475" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">1</text>
  <text x="575" y="126" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">1.8 × 10⁻³</text>

  <text x="475" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">2</text>
  <text x="575" y="146" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">3.1 × 10⁻⁶</text>

  <text x="475" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ef4444" font-weight="bold">3</text>
  <text x="575" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#ef4444" font-weight="bold">9.7 × 10⁻¹²</text>

  <!-- Légende en bas -->
  <rect x="430" y="200" width="250" height="64" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="450" cy="222" r="4" fill="#3b82f6" opacity="0.5"/>
  <circle cx="450" cy="222" r="4" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <text x="462" y="226" font-family="sans-serif" font-size="11" fill="#334155">Points sur la courbe 0</text>
  <circle cx="450" cy="244" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="450" cy="244" r="4" fill="none" stroke="#10b981" stroke-width="1"/>
  <text x="462" y="248" font-family="sans-serif" font-size="11" fill="#334155">Points sur la courbe 1</text>
  <line x1="444" y1="262" x2="456" y2="262" stroke="#ef4444" stroke-width="1.5"/>
  <text x="462" y="266" font-family="sans-serif" font-size="11" fill="#334155">Résidu (se réduit à chaque pas)</text>

  <!-- Texte d'annotation -->
  <text x="40" y="355" font-family="sans-serif" font-size="12" fill="#64748b">À chaque itération, les points bleu et vert se rapprochent. Le résidu (trait rouge)</text>
  <text x="40" y="373" font-family="sans-serif" font-size="12" fill="#64748b">diminue quadratiquement : le nombre de décimales correctes double à chaque pas.</text>
</svg>
