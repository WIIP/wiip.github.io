<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <marker id="ax-arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>

  <!-- Fond -->
  <rect width="700" height="420" fill="#ffffff"/>

  <!-- Axes -->
  <!-- Origine à (100, 360) ; échelle : 1 unité = 100px en x, 80px en y -->
  <line x1="80" y1="360" x2="660" y2="360" stroke="#333" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <line x1="100" y1="380" x2="100" y2="20" stroke="#333" stroke-width="1.5" marker-end="url(#ax-arrow)"/>
  <text x="665" y="375" font-family="serif" font-style="italic" font-size="16" fill="#333">x</text>
  <text x="108" y="25" font-family="serif" font-style="italic" font-size="16" fill="#333">y</text>

  <!-- Graduations -->
  <line x1="200" y1="356" x2="200" y2="364" stroke="#333" stroke-width="1"/>
  <text x="196" y="378" font-family="serif" font-size="13" fill="#333">1</text>
  <line x1="300" y1="356" x2="300" y2="364" stroke="#333" stroke-width="1"/>
  <text x="296" y="378" font-family="serif" font-size="13" fill="#333">2</text>
  <line x1="400" y1="356" x2="400" y2="364" stroke="#333" stroke-width="1"/>
  <text x="396" y="378" font-family="serif" font-size="13" fill="#333">3</text>
  <line x1="96" y1="280" x2="104" y2="280" stroke="#333" stroke-width="1"/>
  <text x="80" y="284" font-family="serif" font-size="13" fill="#333">1</text>
  <line x1="96" y1="200" x2="104" y2="200" stroke="#333" stroke-width="1"/>
  <text x="80" y="204" font-family="serif" font-size="13" fill="#333">2</text>
  <line x1="96" y1="120" x2="104" y2="120" stroke="#333" stroke-width="1"/>
  <text x="80" y="124" font-family="serif" font-size="13" fill="#333">3</text>
  <line x1="96" y1="40" x2="104" y2="40" stroke="#333" stroke-width="1"/>
  <text x="80" y="44" font-family="serif" font-size="13" fill="#333">4</text>

  <!-- Courbe y = x² -->
  <!-- Points calculés : x=0→(100,360), x=0.5→(150,340), x=1→(200,280), x=1.5→(250,180), x=2→(300,40) -->
  <!-- Échelle ajustée : y = 360 - 80*x² -->
  <!-- x=0→(100,360), x=0.5→(150,340), x=1→(200,280), x=1.25→(225,235), x=1.5→(250,180)
       x=1.75→(275,115), x=2→(300,40), on continue un peu : x=2.1→(310,7) -->
  <path d="M 100,360 C 150,355 175,320 200,280
           C 225,240 237,210 250,180
           C 263,150 275,115 287,78
           C 295,50 300,40 310,7"
        fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Label courbe -->
  <text x="315" y="22" font-family="serif" font-style="italic" font-size="15" fill="#2563eb">y = x²</text>

  <!-- ===== Point A : x=1, y=1 → pixel (200, 280) ===== -->
  <circle cx="200" cy="280" r="5" fill="#333" stroke="#fff" stroke-width="1.5"/>

  <!-- ===== Point B : x=1.6, y=2.56 → pixel (260, 155.2) ===== -->
  <!-- x=1.6 → 100 + 1.6*100 = 260, y=2.56 → 360 - 2.56*80 = 155.2 -->
  <circle cx="260" cy="155" r="5" fill="#333" stroke="#fff" stroke-width="1.5"/>

  <!-- Ligne horizontale de A vers la droite : dx -->
  <line x1="200" y1="280" x2="260" y2="280" stroke="#e11d48" stroke-width="2"/>

  <!-- Ligne verticale de (260, 280) vers B : dy total -->
  <line x1="260" y1="280" x2="260" y2="155" stroke="#16a34a" stroke-width="2"/>

  <!-- ===== Décomposition de dy ===== -->
  <!-- dy = 2x·dx + dx² -->
  <!-- Avec x=1, dx=0.6 : 2x·dx = 1.2 → 1.2*80 = 96px, dx² = 0.36 → 0.36*80 = 28.8px -->
  <!-- Donc : partie 2x·dx va de y=280 à y=184, partie dx² va de y=184 à y=155 -->

  <!-- Séparateur entre les deux parties de dy -->
  <line x1="255" y1="184" x2="265" y2="184" stroke="#666" stroke-width="1.2"/>

  <!-- ===== Labels ===== -->

  <!-- Label dx (horizontal, sous la ligne) -->
  <text x="218" y="300" font-family="serif" font-style="italic" font-size="15" fill="#e11d48">dx</text>

  <!-- Accolade pour 2x·dx (partie principale de dy) -->
  <text x="274" y="240" font-family="serif" font-style="italic" font-size="14" fill="#16a34a">2x · dx</text>

  <!-- Accolade pour dx² (partie négligée) -->
  <!-- Zone de y=184 à y=155, centre à y=170 -->
  <text x="274" y="173" font-family="serif" font-style="italic" font-size="13" fill="#999">dx²</text>

  <!-- Annotation "négligé" avec une croix -->
  <text x="310" y="173" font-family="sans-serif" font-size="11" fill="#ef4444">← négligé</text>

  <!-- Pointillés horizontaux depuis le point A vers l'axe y -->
  <line x1="100" y1="280" x2="200" y2="280" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Pointillés horizontaux depuis le point B vers l'axe y -->
  <line x1="100" y1="155" x2="260" y2="155" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Pointillés verticaux depuis A vers l'axe x -->
  <line x1="200" y1="280" x2="200" y2="360" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3"/>
  <!-- Pointillés verticaux depuis B vers l'axe x -->
  <line x1="260" y1="155" x2="260" y2="360" stroke="#999" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Labels des points sur les axes -->
  <text x="192" y="395" font-family="serif" font-style="italic" font-size="13" fill="#333">x</text>
  <text x="237" y="395" font-family="serif" font-style="italic" font-size="13" fill="#333">x + dx</text>

  <text x="28" y="284" font-family="serif" font-style="italic" font-size="12" fill="#333">x² = 1</text>

  <!-- Label du point A -->
  <text x="145" y="270" font-family="serif" font-size="13" fill="#333">A</text>

  <!-- Label du point B -->
  <text x="268" y="148" font-family="serif" font-size="13" fill="#333">B</text>

  <!-- Tangente en A (pente = 2x = 2) -->
  <!-- En pixels : pente = -2 * 80/100 = -1.6 (négatif car y descend) -->
  <!-- Depuis (200, 280) : à x+150 → y = 280 - 1.6*150 = 40 ; à x-80 → y = 280 + 1.6*80 = 408 → on clippe -->
  <line x1="130" y1="392" x2="350" y2="40" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>

  <!-- Légende en bas à droite -->
  <g transform="translate(420, 240)">
    <rect x="0" y="0" width="250" height="115" rx="6" fill="#f8f9fa" stroke="#ddd" stroke-width="1"/>

    <line x1="15" y1="28" x2="40" y2="28" stroke="#e11d48" stroke-width="2"/>
    <text x="50" y="33" font-family="serif" font-style="italic" font-size="14" fill="#333">dx — incrément horizontal</text>

    <line x1="15" y1="58" x2="40" y2="58" stroke="#16a34a" stroke-width="2"/>
    <text x="50" y="63" font-family="serif" font-style="italic" font-size="14" fill="#333">2x · dx — partie conservée</text>

    <line x1="15" y1="88" x2="40" y2="88" stroke="#999" stroke-width="2"/>
    <text x="50" y="93" font-family="serif" font-style="italic" font-size="14" fill="#999">dx² — partie "supprimée"</text>
  </g>
</svg>
