<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 836 260" width="836" height="260" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">From the manufacturer's catalogue to a published BIM library</title>
